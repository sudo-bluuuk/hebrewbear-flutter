name: hebrewbear
description: Self-hosted Hebrew vocabulary with root-based verb conjugation.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.0
  provider: ^6.1.0
  drift: ^2.20.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  fonts:
    - family: Noto Serif Hebrew
      fonts:
        - asset: fonts/Noto_Serif_Hebrew/static/NotoSerifHebrew/NotoSerifHebrew-Regular.ttf
